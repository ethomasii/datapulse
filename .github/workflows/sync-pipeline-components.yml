name: sync-pipeline-components

on:
  push:
    branches: [main]
    paths:
      - "web/lib/elt/native-components/**"
      - "packages/pipeline-components/**"
      - "web/lib/elt/data/native-components-manifest.json"
      - "scripts/export-native-catalog.ts"
      - "scripts/export-pipeline-components-catalog.mjs"
      - "scripts/ci-push-pipeline-components-catalog.sh"
      - ".github/workflows/sync-pipeline-components.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps (tsx export)
        run: npm ci
        working-directory: web

      - name: Export catalog
        run: node scripts/export-pipeline-components-catalog.mjs

      - name: Publish catalog branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/ci-push-pipeline-components-catalog.sh

      - name: Publish standalone repo (when token configured)
        env:
          PIPELINE_COMPONENTS_GH_TOKEN: ${{ secrets.PIPELINE_COMPONENTS_GH_TOKEN }}
          GH_TOKEN: ${{ secrets.PIPELINE_COMPONENTS_GH_TOKEN }}
          GITHUB_ACTIONS: "true"
        run: |
          if [ -z "${PIPELINE_COMPONENTS_GH_TOKEN}" ]; then
            echo "PIPELINE_COMPONENTS_GH_TOKEN not set; skipping external repo publish."
            echo "Catalog branch sync succeeded — that is the CI canonical path."
            exit 0
          fi
          if gh repo view ethomasii/eltpulse-pipeline-components >/dev/null 2>&1; then
            node scripts/publish-pipeline-components.mjs
          else
            echo "ethomasii/eltpulse-pipeline-components not visible; catalog branch is canonical."
          fi
